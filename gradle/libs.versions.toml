# Pinned to a known-good set. Run Android Studio's AGP Upgrade Assistant
# before you start, then `./gradlew build` to confirm nothing drifted.
[versions]
agp                = "8.7.3"
kotlin             = "2.1.0"
ksp                = "2.1.0-1.0.29"
hilt               = "2.53.1"
composeBom         = "2024.12.01"
coreKtx            = "1.15.0"
lifecycle          = "2.8.7"
activityCompose    = "1.9.3"
navigationCompose  = "2.8.5"
room               = "2.6.1"
media3             = "1.5.1"
work               = "2.10.0"
hiltWork           = "1.2.0"
datastore          = "1.1.1"
paging             = "3.3.5"
pagingCompose      = "3.3.5"
coil               = "2.7.0"
okhttp             = "4.12.0"
retrofit           = "2.11.0"
serialization      = "1.7.3"
coroutines         = "1.9.0"
retrofitSerializer = "1.0.0"
playAuth           = "21.3.0"
googleApiClient    = "2.7.0"
driveApi           = "v3-rev20241027-2.0.0"
securityCrypto     = "1.1.0-alpha06"
smbj               = "0.13.0"
youtubedl          = "0.17.3"
junit              = "4.13.2"
androidxTest       = "1.2.1"

[libraries]
androidx-core-ktx            = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose    = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime   = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service   = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-navigation-compose  = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

compose-bom            = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui             = { module = "androidx.compose.ui:ui" }
compose-ui-graphics    = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling     = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-preview     = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3      = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }

room-runtime  = { module = "androidx.room:room-runtime",  version.ref = "room" }
room-ktx      = { module = "androidx.room:room-ktx",      version.ref = "room" }
room-paging   = { module = "androidx.room:room-paging",   version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session   = { module = "androidx.media3:media3-session",   version.ref = "media3" }
media3-datasource        = { module = "androidx.media3:media3-datasource",        version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-ui        = { module = "androidx.media3:media3-ui",        version.ref = "media3" }
media3-common    = { module = "androidx.media3:media3-common",    version.ref = "media3" }

hilt-android          = { module = "com.google.dagger:hilt-android",          version.ref = "hilt" }
hilt-compiler         = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation       = { module = "androidx.hilt:hilt-navigation-compose",   version.ref = "hiltWork" }
hilt-work             = { module = "androidx.hilt:hilt-work",                 version.ref = "hiltWork" }
hilt-work-compiler    = { module = "androidx.hilt:hilt-compiler",             version.ref = "hiltWork" }

work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
datastore    = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
paging-runtime = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "pagingCompose" }
security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
okhttp       = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit     = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerializer" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playAuth" }
google-api-client-android = { module = "com.google.api-client:google-api-client-android", version.ref = "googleApiClient" }
google-api-drive = { module = "com.google.apis:google-api-services-drive", version.ref = "driveApi" }

smbj = { module = "com.hierynomus:smbj", version.ref = "smbj" }

youtubedl-library = { module = "io.github.junkfood02.youtubedl-android:library", version.ref = "youtubedl" }
youtubedl-ffmpeg  = { module = "io.github.junkfood02.youtubedl-android:ffmpeg",  version.ref = "youtubedl" }
youtubedl-aria2c  = { module = "io.github.junkfood02.youtubedl-android:aria2c",  version.ref = "youtubedl" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTest" }

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
android-library      = { id = "com.android.library",     version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                 = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
