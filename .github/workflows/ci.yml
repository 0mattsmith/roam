name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'   # only used if the wrapper is missing

      # Most people only have the Gradle bundled inside Android Studio, so the
      # wrapper JAR may not be committed yet. setup-gradle put `gradle` on PATH
      # above; use it to generate the wrapper on the fly.
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::notice::gradle-wrapper.jar absent - generating with Gradle 8.9"
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      # Debug builds are signed with the auto-generated debug key, so this
      # needs no secrets and runs on pull requests from anywhere.
      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Informational while the app is a scaffold -- exported service/provider
      # and unused-resource warnings are expected. Compile errors above still
      # fail the job.
      - name: Lint
        continue-on-error: true
        run: ./gradlew lint --no-daemon

      # gh run view --log-failed reads an archive GitHub takes minutes to
      # publish. An artifact is available as soon as the run ends, so this is
      # what commit.ps1 pulls on a red build.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/problems/**
          if-no-files-found: ignore
          retention-days: 7
